<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#072A1C">
<meta name="robots" content="noindex, nofollow">
<title>סמ״י — מסך נוכחות</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; }
  body { background: var(--green-950); color: var(--cream); overflow: hidden; }
  .bg { position: fixed; inset: 0; z-index: 0; }
  .bg img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%; opacity: .55; }
  .bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(270deg, rgba(4, 23, 15, .96) 0%, rgba(4, 23, 15, .88) 45%, rgba(4, 23, 15, .55) 100%); }
  .screen, .msg { position: relative; z-index: 1; }
  .screen { height: 100vh; height: 100dvh; display: grid; grid-template-columns: 1fr auto; gap: 4vmin; padding: 4vmin 5vmin; align-items: center; }
  .side { display: flex; flex-direction: column; gap: 2.4vmin; min-width: 0; }
  .brand-line { display: flex; align-items: center; gap: 2vmin; color: var(--gold-2); font-size: 2.8vmin; font-weight: 700; animation: rise .6s ease-out both; }
  .brand-line .emblem-badge { width: 11vmin; height: 11vmin; animation: badgeIn .9s var(--ease-pop) both; }
  .dl { display: flex; flex-direction: column; line-height: 1.1; }
  .dl b { font-family: var(--display); font-weight: 900; font-size: 5.2vmin; color: var(--cream); letter-spacing: .3vmin; }
  .dl small { font-size: 2.2vmin; color: var(--gold-2); font-weight: 700; }
  .display-credit { position: fixed; bottom: 1.6vmin; right: 2.4vmin; margin: 0; z-index: 2; font-size: 1.5vmin; color: rgba(244, 239, 226, .55); }
  .display-credit .credit-en { font-size: 1.4vmin; color: var(--gold-2); }
  .ev-name { animation: rise .6s ease-out both .15s; font-family: var(--display); font-weight: 900; font-size: 6.2vmin; line-height: 1.12; margin: 0; }
  .mode { align-self: flex-start; font-size: 5vmin; font-weight: 600; padding: 1.2vmin 3.2vmin; border-radius: 999px; background: #12804A; color: #fff; box-shadow: 0 0 0 0.5vmin rgba(255, 255, 255, .12); animation: popIn .6s var(--ease-pop) both .3s; }
  .mode.exit { background: linear-gradient(180deg, var(--gold-2), var(--gold)); color: var(--green-950); }
  .steps-big { margin: 0; padding: 0; list-style: none; display: grid; gap: 1.6vmin; font-size: 3vmin; color: #DCE6DF; }
  .steps-big li { display: flex; gap: 1.8vmin; align-items: center; }
  .steps-big .n { flex: none; width: 5vmin; height: 5vmin; border-radius: 50%; background: var(--green-800); color: var(--gold); display: grid; place-items: center; font-weight: 600; font-size: 2.6vmin; }
  .paid { animation: popIn .6s var(--ease-pop) both .45s; display: flex; align-items: center; gap: 2vmin; background: #8E1A12; color: #fff; border: 0.5vmin solid var(--gold-2); border-radius: 2.4vmin; padding: 2vmin 2.8vmin; font-size: 3.4vmin; font-weight: 800; line-height: 1.25; box-shadow: 0 1.6vmin 4vmin rgba(0, 0, 0, .35); }
  .paid .ex { flex: none; width: 6.4vmin; height: 6.4vmin; border-radius: 50%; background: var(--gold-2); color: #8E1A12; display: grid; place-items: center; font-size: 4.4vmin; font-weight: 900; }
  .qr-wrap { animation: popIn .7s var(--ease-pop) both .1s; border: 0.8vmin solid var(--gold); background: #fff; border-radius: 3vmin; padding: 2vmin; box-shadow: 0 2vmin 6vmin rgba(0, 0, 0, .35); display: flex; flex-direction: column; align-items: center; gap: 1.4vmin; }
  #qr { width: min(78vh, 54vw); height: min(78vh, 54vw); display: block; image-rendering: pixelated; }
  .bar { width: 100%; height: 1.2vmin; background: #ECE4D0; border-radius: 1vmin; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 100%; background: var(--gold); transform-origin: right; }
  .clock { font-size: 2.6vmin; color: var(--green-900); font-variant-numeric: tabular-nums; font-weight: 500; }
  .err-banner { position: fixed; top: 0; left: 0; right: 0; background: var(--bad); color: #fff; text-align: center; padding: 1.2vmin; font-size: 2.6vmin; }
  .tools { position: fixed; bottom: 1.6vmin; left: 1.6vmin; display: flex; gap: 1vmin; opacity: .35; transition: opacity .2s; }
  .tools:hover { opacity: 1; }
  .msg { display: grid; place-items: center; height: 100vh; text-align: center; padding: 6vmin; font-size: 3.4vmin; }
  .stale #qr { opacity: .15; }
  @media (orientation: portrait) {
    .screen { grid-template-columns: 1fr; grid-template-rows: auto auto; align-content: center; justify-items: center; text-align: center; }
    .side { align-items: center; order: 2; }
    .mode { align-self: center; }
    .steps-big { font-size: 2.6vmin; justify-items: start; }
    .paid { font-size: 3vmin; }
    #qr { width: 72vw; height: 72vw; }
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><img src="stadium-1920.webp" alt=""></div>
<div id="msg" class="msg"><div><span class="spinner light"></span><p>טוען את מסך הנוכחות…</p></div></div>

<div class="screen" id="screen" hidden>
  <div class="side">
    <div class="brand-line"><span class="emblem-badge"><img src="emblem-256.webp" alt="סמל מרחב כרמל"></span><span class="dl"><b>סמ״י</b><small>סד״כ מבצעי ייעודי · מרחב כרמל</small></span></div>
    <h1 class="ev-name" id="evName"></h1>
    <div class="mode" id="mode">סרוק לכניסה</div>
    <ol class="steps-big">
      <li><span class="n">1</span> פתח את דף הנוכחות בטלפון</li>
      <li><span class="n">2</span> לחץ על כפתור הסריקה</li>
      <li><span class="n">3</span> כוון את המצלמה לקוד</li>
    </ol>
    <div class="paid" role="note"><span class="ex" aria-hidden="true">!</span><span id="paidText">יש לסמן כניסה גם באפליקציית עבודה בתשלום!</span></div>
  </div>
  <div class="qr-wrap">
    <canvas id="qr" aria-label="קוד נוכחות מתחלף"></canvas>
    <div class="bar"><i id="barFill"></i></div>
    <div class="clock" id="clock"></div>
  </div>
</div>

<div class="err-banner" id="errBanner" hidden>אין חיבור לשרת — הקוד ממשיך להתחלף, מנסה להתחבר מחדש</div>
<div class="credit display-credit">
  <span>אפליקציה פותחה על ידי</span>
  <span class="credit-en" dir="ltr">Powered by Avshalom Even</span>
</div>
<div class="tools"><button class="btn sm ghost light" id="fsBtn" type="button">מסך מלא</button></div>

<script src="config.js"></script>
<script src="app.js"></script>
<script src="vendor/qrcode.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var e = NV.param('e');
  var d = NV.param('d');
  var tokens = [];
  var offset = 0;
  var windowMs = 15000;
  var current = '';
  var scanBase = NV.baseUrl() + 'scan.html?e=' + encodeURIComponent(e) + '#q=';
  var failures = 0;

  function fail(text) {
    $('msg').innerHTML = '<div><p style="font-size:4.4vmin;margin:0 0 1vmin"><b>' + NV.esc(text) + '</b></p><p style="color:#B8C9BE">בדוק את קישור מסך התצוגה במסך הניהול</p></div>';
    $('msg').hidden = false;
    $('screen').hidden = true;
  }

  function load() {
    return NV.api('display', { e: e, d: d }, { timeout: 15000 }).then(function (r) {
      if (!r.ok) {
        if (r.code === 'LINK') { fail(r.error); return; }
        throw new Error(r.error);
      }
      failures = 0;
      $('errBanner').hidden = true;
      offset = r.serverTime - Date.now();
      windowMs = r.windowSec * 1000;
      tokens = r.tokens;
      $('evName').textContent = r.event.name;
      document.title = 'סמ״י — ' + r.event.name;
      var m = $('mode');
      m.textContent = r.event.exitOpen ? 'סרוק ליציאה' : 'סרוק לכניסה';
      m.classList.toggle('exit', r.event.exitOpen);
      $('paidText').textContent = r.event.exitOpen ? 'יש לסמן יציאה גם באפליקציית עבודה בתשלום!' : 'יש לסמן כניסה גם באפליקציית עבודה בתשלום!';
      $('msg').hidden = true;
      $('screen').hidden = false;
      paint(true);
    }).catch(function () {
      failures++;
      if (!tokens.length) { fail('אין חיבור לשרת'); setTimeout(load, 5000); return; }
      $('errBanner').hidden = failures < 2;
    });
  }

  function now() { return Date.now() + offset; }

  function paint(force) {
    if (!tokens.length) return;
    var t = now();
    var w = Math.floor(t / windowMs);
    var tok = null;
    for (var i = 0; i < tokens.length; i++) if (tokens[i].w === w) tok = tokens[i];
    var screen = $('screen');
    if (!tok) { screen.classList.add('stale'); return; }
    screen.classList.remove('stale');
    if (force || tok.token !== current) {
      current = tok.token;
      var c = $('qr');
      NV.drawQr(c, scanBase + encodeURIComponent(tok.token), { size: c.clientWidth, level: 'M', quiet: 2, dark: '#04170F' });
    }
    var frac = (t % windowMs) / windowMs;
    $('barFill').style.transform = 'scaleX(' + (1 - frac).toFixed(3) + ')';
    $('clock').textContent = new Date(t).toLocaleTimeString('he-IL', { timeZone: 'Asia/Jerusalem', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  if (!e || !d) { fail('קישור מסך התצוגה חסר או שגוי'); return; }

  setInterval(function () { paint(false); }, 250);
  setInterval(load, 30000);
  window.addEventListener('resize', function () { paint(true); });
  load();

  var lock = null;
  function keepAwake() {
    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').then(function (l) { lock = l; }).catch(function () {});
    }
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { keepAwake(); load(); } });
  keepAwake();

  $('fsBtn').addEventListener('click', function () {
    var el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
    setTimeout(function () { paint(true); }, 400);
  });
})();
</script>
</body>
</html>
